name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Esquema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Atlas
        run: |
          curl -sSfL https://atlasbinaries.com/atlas/atlas-community-linux-amd64-v1.3.0 \
            -o "$RUNNER_TEMP/atlas"
          chmod +x "$RUNNER_TEMP/atlas"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Reconstruir los cuatro esquemas
        run: tools/db-rebuild.sh

      - name: Validar migraciones
        run: |
          for db in clinic portal inbox directory; do
            atlas migrate validate --dir "file://$PWD/db/migrations/$db"
          done

  qt:
    name: Qt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      - name: Pruebas
        run: ctest --test-dir build --output-on-failure

      - name: qmllint
        run: qmllint -I "$QT_ROOT_DIR/qml" fuzzy_desktop/qml/*.qml

  portal:
    name: Portal y sync (fase 5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      - name: Migraciones, proyector, buzón, solicitudes y sync
        run: |
          ctest --test-dir build --output-on-failure -R "tst_migration_runner|tst_portal_projector|tst_portal_provisioner|tst_buzon_recoleccion|tst_solicitud_cita|tst_sync_engine"

  imagenes:
    name: Imágenes (fase 6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      - name: Fotos, adjuntos y ausencia de binarios en Turso
        run: |
          ctest --test-dir build --output-on-failure -R "tst_file_store|tst_mascota_foto|tst_adjuntos_clinicos"

  desktop:
    name: Escritorio (fase 7)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      - name: Controladores y baselines visuales
        run: |
          ctest --test-dir build --output-on-failure -R "tst_controladores|tst_visual"

      - name: qmllint de todas las vistas
        run: qmllint -I "$QT_ROOT_DIR/qml" fuzzy_desktop/qml/*.qml

  movil:
    name: Móvil (fase 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      - name: Cifrado, servicios y controladores del teléfono
        run: |
          ctest --test-dir build --output-on-failure -R "tst_cryptobox|tst_movil_servicios|tst_mobile|tst_mobile_qml"

      - name: qmllint de todas las vistas del teléfono
        run: qmllint -I "$QT_ROOT_DIR/qml" fuzzy_mobile/qml/*.qml

      - name: Sin tokens de portal en el binario
        run: |
          for patron in token_portal portal_token token-clinica token-portal; do
            if strings -a build/fuzzy_mobile/fuzzy_mobile | grep -qi -- "$patron"; then
              echo "El binario móvil contiene el patrón prohibido: $patron" >&2
              exit 1
            fi
          done

  contract:
    name: Contrato del portal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build

      - name: El portal solo contiene el esquema del dueño
        run: ctest --test-dir build --output-on-failure -R tst_portal_contract
